# Changelog entries are fragments in .changes/unreleased/ beside this file
# (AGENTS.md "Testing and Commits"). Every project directory holds a copy of
# this file, so changie run in a project writes that project's fragments and
# CHANGELOG.md; the `changelog` check keeps the copies equal.
changesDir: .changes
unreleasedDir: unreleased
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: "## {{.Version}}"
kindFormat: "\n### {{.Kind}}\n"
changeFormat: "- {{.Body}}"
fragmentFileFormat: '{{.Kind}}-{{.Time.Format "20060102-150405"}}-{{.Time.Nanosecond}}'
kinds:
  - label: Added
  - label: Changed
  - label: Deprecated
  - label: Removed
  - label: Fixed
  - label: Security
