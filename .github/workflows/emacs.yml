name: Emacs markus
on:
  push:
    paths:
      - 'flake.*'
      - 'sources/emacs/**/*'
    branches:
      - main
  workflow_dispatch:
jobs:
  nix-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.05
      - uses: cachix/cachix-action@v16
        with:
          name: jylhis-nixos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#emacsJ
  deploy:
    needs: nix-package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout Source Repository
        uses: actions/checkout@v5
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Configure Git
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
      - name: Clone Target Repository
        run: |
          gh repo clone Jylhis/.emacs.d target-repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Copy Emacs Files
        run: |
          rsync -av --delete --exclude=.git sources/emacs/ target-repo/
      - name: Commit and Push Changes
        run: |
          cd "${GITHUB_WORKSPACE}/target-repo"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Sync Emacs configuration from source repository"
            git push https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/Jylhis/.emacs.d.git main
          else
            echo "No changes to commit."
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
