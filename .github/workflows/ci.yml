# CI for the Jotain Emacs configuration — pull requests only.
#
# Runs the lightweight subset of nix/checks.nix on every PR, plus
# elisp-compile: the default Emacs is the unstable variant (Emacs 31
# pretest), so the warnings-as-errors byte-compile gate must catch 31
# obsoletions before merge, not on main. The heavy package builds
# (packages-default, packages-info) stay deferred to deploy.yml on main
# so PR latency stays low even on cache miss.
#
# Two parallel jobs on x86_64-linux:
#
#   check — formatting, statix, deadnix, module-eval,
#           packages-doc-in-sync, ds-in-sync, packages-doc, options-doc, elisp-lint
#           (paren check), elisp-compile (both transitively build the
#           bare jotainEmacs from cache).  Skips the full grammar
#           distribution — that runs in deploy.yml.
#   test  — devenv test (dev environment assertions from devenv.nix).
#
# The jylhis cachix cache is pull-only here: PR runs (including from
# forks) get no CACHIX_AUTH_TOKEN, so the writer token is never exposed
# to untrusted code.  Cache *pushes* happen in deploy.yml on protected
# branches.
name: CI

# workflow_dispatch exists because pushes from the Claude Code GitHub
# App don't create pull_request synchronize runs — CI on such PRs is
# kicked manually (gh workflow run ci.yml --ref <branch>).
on:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          # The default jotainEmacs base (emacs-unstable, Emacs 31
          # pretest) is cached on nix-community.cachix.org.
          extraPullNames: nix-community

      # Dependabot bumps flake.lock but not devenv.yaml/devenv.lock, so
      # the shared-input pins drift apart silently without this gate.
      # sync-devenv.yml repairs that automatically on Dependabot
      # branches; this step stays as the fast-fail guard for every other
      # PR, and the locks-in-sync flake check covers main/next.
      # `just verify` is bash+jq over the two lock files — no nix build.
      - name: Check — lock files in sync (just verify)
        run: nix run nixpkgs#just -- verify

      # Each check is a separate step so a failure surfaces by name in
      # the GitHub Actions UI without needing log access.
      - name: Debug — confirm flake checks resolve
        run: |
          nix --version
          nix eval --raw .#checks.x86_64-linux \
            --apply 'cs: builtins.concatStringsSep "\n" (builtins.attrNames cs)'
          echo

      - name: Check — formatting
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.formatting

      - name: Check — statix
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.statix

      - name: Check — deadnix
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.deadnix

      - name: Check — module-eval
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.module-eval

      - name: Check — packages-doc-in-sync
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.packages-doc-in-sync

      - name: Check — ds-in-sync
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.ds-in-sync

      - name: Check — packages-doc
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.packages-doc

      - name: Check — options-doc
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.options-doc

      - name: Check — elisp-lint
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.elisp-lint

      - name: Check — elisp-compile
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.elisp-compile

  site:
    name: Site
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          # The site renders man pages and the Emacs/Elisp manuals from
          # jotainEmacs (emacs-unstable base, cached on nix-community).
          extraPullNames: nix-community

      # Validate the full jotain.j10s.io site assembly (docs pages,
      # manual HTML, man pages, Emacs/Elisp manuals, options/package
      # references) so a docs or website change can't break the
      # site-branch deploy that runs post-merge in deploy.yml.
      - name: Build site
        run: nix build --no-link --print-build-logs .#site

  test:
    name: Dev environment
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          extraPullNames: devenv,nix-community

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: devenv test
        run: devenv test

  # SCRATCH — one-off measurement, not meant to stay in CI. Quantifies the
  # closure-size delta between the full ~275-grammar distribution and the
  # curated ~26-grammar subset, to put a real number on the
  # nix/mk-overlay.nix curatedGrammars comment. Remove this job once the
  # numbers are read out of the run log.
  measure-grammars:
    name: Measure grammar closure delta (scratch)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          extraPullNames: nix-community

      - name: Build full distribution (packages.default)
        run: nix build --no-link --print-build-logs --show-trace -o result-default .#default

      - name: Build curated distribution (packages.emacs-lite)
        run: nix build --no-link --print-build-logs --show-trace -o result-lite .#emacs-lite

      - name: Report closure sizes
        run: |
          echo "=== packages.default (full ~275 grammars) ==="
          nix path-info -Sh ./result-default | tail -1
          echo
          echo "=== packages.emacs-lite (curated ~26 grammars) ==="
          nix path-info -Sh ./result-lite | tail -1
          echo
          echo "=== shared store paths (requisites in common) ==="
          comm -12 \
            <(nix-store -q --requisites ./result-default | sort) \
            <(nix-store -q --requisites ./result-lite | sort) \
            | wc -l
          echo "=== tree-sitter grammar paths: default vs lite ==="
          nix-store -q --requisites ./result-default | grep -c tree-sitter || true
          nix-store -q --requisites ./result-lite | grep -c tree-sitter || true
          echo "=== grammar paths NOT shared between the two (should be all default-only, i.e. the ~249 dropped grammars) ==="
          comm -23 \
            <(nix-store -q --requisites ./result-default | grep tree-sitter | sort) \
            <(nix-store -q --requisites ./result-lite | grep tree-sitter | sort) \
            | wc -l
