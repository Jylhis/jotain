# PR CI: the lightweight subset of nix/checks.nix, plus elisp-compile so
# Emacs 31 obsoletions fail before merge. The rest (package builds,
# elisp-test, emacs-api-doc, …) runs in deploy.yml's `nix flake check`.
#
# cachix is pull-only: no CACHIX_AUTH_TOKEN is exposed to untrusted PR
# code. Pushes happen in deploy.yml.
name: CI

# workflow_dispatch: pushes from the Claude Code GitHub App create no
# synchronize runs, so kick those manually (gh workflow run ci.yml --ref
# <branch>).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          # Hosts the default jotainEmacs base (emacs-unstable).
          extraPullNames: nix-community

      # Fast bash+jq gate on flake.lock vs devenv.lock drift; the
      # locks-in-sync flake check covers main/next.
      - name: Check — lock files in sync (just verify)
        run: nix run nixpkgs#just -- verify

      # One step per check, so a failure surfaces by name in the UI.
      - name: Debug — confirm flake checks resolve
        run: |
          nix --version
          nix eval --raw .#checks.x86_64-linux \
            --apply 'cs: builtins.concatStringsSep "\n" (builtins.attrNames cs)'
          echo

      - name: Check — formatting
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.formatting

      - name: Check — statix
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.statix

      - name: Check — deadnix
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.deadnix

      - name: Check — module-eval
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.module-eval

      - name: Check — packages-doc-in-sync
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.packages-doc-in-sync

      - name: Check — eca-models-in-sync
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.eca-models-in-sync

      - name: Check — ds-in-sync
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.ds-in-sync

      - name: Check — packages-doc
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.packages-doc

      - name: Check — options-doc
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.options-doc

      - name: Check — elisp-lint
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.elisp-lint

      - name: Check — scanner-fidelity
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.scanner-fidelity

      - name: Check — elisp-compile
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.elisp-compile

      # Reuses elisp-compile's closure; evaluates every use-package :config
      # block, which byte-compiling never does.
      - name: Check — config-startup
        run: nix build --no-link --print-build-logs --show-trace .#checks.x86_64-linux.config-startup

  site:
    name: Site
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          # Man pages and manuals come from jotainEmacs.
          extraPullNames: nix-community

      # Catches docs/website breakage before the post-merge Pages deploy.
      # `.#site-preview` omits the heavy /help/api/ reference, which only
      # deploy.yml builds.
      - name: Build site
        run: nix build --no-link --print-build-logs .#site-preview

  test:
    name: Dev environment
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          extraPullNames: devenv,nix-community

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: devenv test
        run: devenv test
