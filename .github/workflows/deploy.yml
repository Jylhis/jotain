# Full validation + deploy for protected branches.
#
# main: check (full nix flake check) and test (devenv test); after check,
#       build-pages -> deploy-pages publishes the full `.#site` to GitHub
#       Pages (Actions source) at page.jylhis.com/jotain/.
# next: check + test only.
#
# Both push new artifacts to the jylhis cachix cache, so later PR runs
# hit it. Pages hosts one deployment; PR previews are artifacts instead
# (preview.yml).
#
# Every `uses:` must be github-owned or match cachix/*: the repo restricts
# Actions to those, and a disallowed action fails the whole run at
# startup with no logs. Use a `run:` step instead.
name: Deploy

on:
  push:
    branches: [main, next]
  workflow_dispatch:

# Never cancel: post-merge cache pushes must finish. Pages builds are
# also serialized below.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    name: Check
    # Covers a cold emacs-api-doc build (one batch Emacs per package).
    # The pushed result makes build-pages' `.#site` a cache hit.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Hosts the default jotainEmacs base (emacs-unstable).
          extraPullNames: nix-community

      - name: nix flake check
        run: nix flake check --print-build-logs

  test:
    name: Dev environment
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: devenv,nix-community

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: devenv test
        run: devenv test

  build-pages:
    # Full `.#site` (including /help/api/ and /packages/), built with
    # baseHref=/jotain to match the project-site URL.
    name: Build site
    if: github.ref == 'refs/heads/main'
    needs: check
    # Normally pulls emacs-api-doc from the cache Check just filled;
    # the headroom covers a cold cache.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Concurrent main pushes queue instead of racing the upload.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Man pages and manuals come from jotainEmacs.
          extraPullNames: nix-community

      - name: Build site
        run: nix build .#site -o result-site

      # Dereferenced, writable copy for upload-pages-artifact to tar.
      - name: Assemble Pages artifact
        run: |
          mkdir -p site
          cp -rL result-site/public/. site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pages:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build-pages
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
