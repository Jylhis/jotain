# Full validation + deploy for protected branches.
#
# main: check (full nix flake check); after check, build-pages ->
#       deploy-pages publishes the full `.#site` to GitHub Pages (Actions
#       source) at page.jylhis.com/jotain/.
# next: check only.
#
# Both push to the jylhis cachix cache. Pages hosts one deployment; PR
# previews are artifacts instead (preview.yml).
#
# Every `uses:` must be github-owned or match cachix/*: the repo restricts
# Actions to those, and a disallowed action fails the whole run at
# startup with no logs. Use a `run:` step instead.
name: Deploy

on:
  push:
    branches: [main, next]
  workflow_dispatch:

# Never cancel: post-merge cache pushes must finish.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    name: Check
    # The pushed result makes build-pages' `.#site` a cache hit.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: nix flake check
        run: nix flake check --print-build-logs

  build-pages:
    name: Build site
    if: github.ref == 'refs/heads/main'
    needs: check
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Concurrent main pushes queue instead of racing the upload.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build site
        run: nix build .#site -o result-site

      - name: Assemble Pages artifact
        run: |
          mkdir -p site
          cp -rL result-site/public/. site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy-pages:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build-pages
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
