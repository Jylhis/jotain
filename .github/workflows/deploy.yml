# Full validation + deploy for protected branches.
#
# On push to main:  check (full nix flake check) → test (devenv test),
#                   then deploy-pages builds the full site
#                   (`nix build .#site`) and publishes it to the ROOT of the
#                   `gh-pages` branch, served at page.jylhis.com/jotain/.
#                   PR previews (pr-preview/pr-N/, published by
#                   preview.yml) are preserved across a production publish.
#                   The `jylhis` cachix cache (the owner's personal cache;
#                   unrelated to any Emacs fork) is repopulated with any
#                   newly built artifacts.
#
# On push to next:  check + test only (no deploys).
#
# GitHub Pages source: this repo serves Pages from the `gh-pages` BRANCH
# (Settings → Pages → "Deploy from a branch", gh-pages / root), not the
# GitHub Actions source. That is what lets PR previews live alongside
# production under one Pages site (a subdirectory per PR); the Actions
# source can only host one deployment. `scripts/publish-gh-pages.sh` writes
# the branch; deploy.yml pushes production to its root and preview.yml
# pushes previews to pr-preview/pr-N/.
#
# Every `uses:` here must be github-owned or match cachix/*: the repo
# restricts Actions to those, and a disallowed action fails the entire
# run at startup with no logs.  Reach for a `run:` step instead.
#
# This workflow is the only place where heavy artifacts (full grammar
# distribution, jotainInfo, options-doc) are re-validated and pushed
# back to cachix, so downstream PRs running ci.yml hit the cache.
name: Deploy

on:
  push:
    branches: [main, next]
  workflow_dispatch:

# Do NOT cancel protected-branch runs — post-merge cache pushes must
# finish.  Pages deploys are additionally serialized below.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# contents: write so the deploy job can push the built site to the
# gh-pages branch (branch-source Pages, not the Actions source).
permissions:
  contents: write

jobs:
  check:
    name: Check
    # 90 (not 30): the full `nix flake check` now includes the
    # emacs-api-doc check, whose first uncached build (a batch Emacs over
    # ~100 packages) is slow. This job pushes results to the jylhis cache,
    # so once it builds emacs-api-doc, deploy-site's `.#site` reuses it as
    # a cache hit and later runs with unchanged inputs are fast.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The default jotainEmacs base (emacs-unstable, Emacs 31
          # pretest) is cached on nix-community.cachix.org.
          extraPullNames: nix-community

      - name: nix flake check
        run: nix flake check --print-build-logs

  test:
    name: Dev environment
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: devenv,nix-community

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: devenv test
        run: devenv test

  deploy-pages:
    # Build the full site (`nix build .#site`, including the /help/api/
    # reference) and publish it to the ROOT of the gh-pages branch,
    # preserving any pr-preview/ directories. GitHub serves the branch as
    # this repo's project site at page.jylhis.com/jotain/ (the site is
    # built with baseHref=/jotain to match).
    name: Deploy site
    if: github.ref == 'refs/heads/main'
    needs: check
    # 60 (not 15): builds the full `.#site` including the /help/api/
    # reference. `needs: check` runs after the Check job has built and
    # pushed emacs-api-doc to the jylhis cache, so this normally pulls it
    # as a cache hit; the extra headroom covers a cold cache.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Serialize gh-pages writers so concurrent main pushes queue instead of
    # racing the branch tip (publish-gh-pages.sh also retries on rejection).
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The site renders man pages and the Emacs/Elisp manuals from
          # jotainEmacs (emacs-unstable base, cached on nix-community).
          extraPullNames: nix-community

      - name: Build site
        run: nix build .#site -o result-site

      # Copy out of the read-only Nix store into a writable tree
      # (dereferencing symlinks) so it can be committed to gh-pages.
      - name: Assemble site tree
        run: |
          mkdir -p site
          cp -rL result-site/public/. site/

      - name: Publish to gh-pages (root, preserving PR previews)
        run: |
          scripts/publish-gh-pages.sh production site \
            "deploy site @ ${GITHUB_SHA::12}"
