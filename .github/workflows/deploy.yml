# Full validation + deploy for protected branches.
#
# On push to main:  check (full nix flake check) → test (devenv test),
#                   then two independent publishes.  deploy-site pushes
#                   the built site to the `site` branch, which Cloudflare
#                   deploys as jotain.j10s.io; build-pages → deploy-pages
#                   publishes the option-reference docs and the
#                   jotain.info manual to GitHub Pages.  The `jylhis`
#                   cachix cache (the owner's personal cache; unrelated
#                   to any Emacs fork) is repopulated with any newly
#                   built artifacts.
#
# On push to next:  check + test only (no deploys).
#
# Every `uses:` here must be github-owned or match cachix/*: the repo
# restricts Actions to those, and a disallowed action fails the entire
# run at startup with no logs.  Reach for a `run:` step instead.
#
# This workflow is the only place where heavy artifacts (full grammar
# distribution, jotainInfo, options-doc) are re-validated and pushed
# back to cachix, so downstream PRs running ci.yml hit the cache.
name: Deploy

on:
  push:
    branches: [main, next]
  workflow_dispatch:

# Do NOT cancel protected-branch runs — post-merge cache pushes must
# finish.  Pages deploys are additionally serialized below.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    name: Check
    # 90 (not 30): the full `nix flake check` now includes the
    # emacs-api-doc check, whose first uncached build (a batch Emacs over
    # ~100 packages) is slow. This job pushes results to the jylhis cache,
    # so once it builds emacs-api-doc, deploy-site's `.#site` reuses it as
    # a cache hit and later runs with unchanged inputs are fast.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The default jotainEmacs base (emacs-unstable, Emacs 31
          # pretest) is cached on nix-community.cachix.org.
          extraPullNames: nix-community

      - name: nix flake check
        run: nix flake check --print-build-logs

  test:
    name: Dev environment
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: devenv,nix-community

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: devenv test
        run: devenv test

  deploy-site:
    # Build the full jotain.j10s.io site and publish it to the `site`
    # branch. The Cloudflare GitHub integration watches that branch
    # (Workers Builds: production branch `site`, root `/`; the
    # wrangler.jsonc at the branch root serves public/ as static
    # assets) — no Cloudflare credentials live in this repo.
    name: Site branch
    if: github.ref == 'refs/heads/main'
    needs: check
    # 60 (not 30): builds the full `.#site` including the /help/api/
    # reference. `needs: check` runs after the Check job has built and
    # pushed emacs-api-doc to the jylhis cache, so this normally pulls it
    # as a cache hit; the extra headroom covers a cold cache.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: site-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The site renders man pages and the Emacs/Elisp manuals from
          # jotainEmacs (emacs-unstable base, cached on nix-community).
          extraPullNames: nix-community

      # `just deploy-site` builds .#site and force-pushes the output as
      # an orphan commit, using the credentials actions/checkout wrote
      # into the local git config. Deliberately not a third-party
      # publish action: this repo's Actions policy allows only
      # github-owned and cachix/* actions, and a disallowed `uses:`
      # fails the whole workflow at startup, not just its own job.
      - name: Build and publish to the site branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: nix run --inputs-from . nixpkgs#just -- deploy-site

  build-pages:
    name: Build docs
    if: github.ref == 'refs/heads/main'
    needs: check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Serialize Pages builds so concurrent main pushes queue instead of
    # racing the upload-pages-artifact step.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build option docs
        run: nix build .#docs -o result-docs

      - name: Build Info manual
        run: nix build .#info -o result-info

      - name: Assemble Pages artifact
        run: |
          mkdir -p site
          cp -rL result-docs/. site/
          cp result-info/share/info/jotain.info site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pages:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build-pages
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
