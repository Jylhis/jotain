# Full validation + deploy for protected branches.
#
# main: check (full nix flake check); after check, deploy builds `.#site` and
#       publishes it with wrangler to the emacs-docs Worker, served at
#       https://emacs.j10s.io/. Needs the repository secrets
#       CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# next: check only.
#
# Both push to the jylhis cachix cache. PR previews are artifacts (preview.yml).
#
# Every `uses:` must be github-owned or match cachix/*: the repo restricts
# Actions to those, and a disallowed action fails the whole run at
# startup with no logs. Use a `run:` step instead.
name: Deploy

on:
  push:
    branches: [main, next]
  workflow_dispatch:

# Never cancel: post-merge cache pushes must finish.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    # The pushed result makes deploy's `.#site` a cache hit.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: nix flake check
        run: nix flake check --print-build-logs

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: check
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Concurrent main pushes queue instead of racing the deploy.
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build site
        run: nix build .#site -o result-site

      # Dereference the read-only store symlinks into a writable tree.
      - name: Materialize the built site
        run: |
          rm -rf dist
          cp -RL result-site/public dist
          chmod -R u+w dist

      - name: Deploy the Worker
        id: deploy
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          nix shell --inputs-from .. nixpkgs#wrangler --command \
            wrangler deploy --assets ../dist | tee "$RUNNER_TEMP/deploy.log"
          version=$(sed -n 's/^Current Version ID: //p' "$RUNNER_TEMP/deploy.log" | tail -n 1)
          if [[ -z "$version" ]]; then
            echo "wrangler printed no version id" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The gate: the Worker serves the version this run uploaded.
      - name: Verify the active deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          url="$url/workers/scripts/emacs-docs/deployments"
          active=$(curl --fail --silent --show-error --max-time 20 --retry 5 --retry-delay 5 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url" |
            jq -r '.result.deployments[0].versions[] | "\(.version_id) \(.percentage)"')
          if [[ "$active" != "$VERSION 100" ]]; then
            printf 'Expected version %s at 100 percent, the Worker serves: %s\n' \
              "$VERSION" "$active" >&2
            exit 1
          fi
          echo "emacs-docs serves version $VERSION"

      # A warning only: Cloudflare Bot Fight Mode on j10s.io answers a managed
      # challenge (HTTP 403) to curl from a GitHub runner.
      - name: Check public routes
        run: |
          check_page() {
            local url="$1" expected="$2" response
            if ! response=$(curl --fail --silent --show-error --location \
              --max-time 20 --retry 3 --retry-delay 10 --retry-all-errors "$url" 2>&1); then
              echo "::warning::$url did not answer the runner: ${response##*$'\n'}"
            elif [[ "$response" != *"$expected"* ]]; then
              echo "::warning::unexpected page at $url"
            fi
          }
          check_page https://emacs.j10s.io/ 'id="buf-readme"'
          check_page https://emacs.j10s.io/docs/ '<title>Documentation'
          check_page https://emacs.j10s.io/docs/installation/ '<title>Installation'
