# PR site previews as downloadable artifacts.
#
# Production Pages is served from the GitHub Actions source (deploy.yml),
# which hosts exactly one deployment, so PR previews can't live under it at
# a stable URL. Instead, on every pull request this builds the full site
# (`nix build .#site`, including /help/api/ and /packages/) and uploads its
# public/ tree as a workflow artifact. A reviewer downloads it from the run
# and serves it locally — e.g.:
#
#   unzip site-preview.zip -d preview
#   d=$(mktemp -d); ln -s "$PWD/preview" "$d/jotain"
#   python3 -m http.server -d "$d" 8080   # → http://localhost:8080/jotain/
#
# (The site is built with baseHref=/jotain, so it must be mounted under
# /jotain/ — the same as `just serve-site`.)
#
# No gh-pages branch, no PAT, no Pages settings change. Every `uses:` here
# must be github-owned or match cachix/* — the repo restricts Actions to
# those.
name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push supersedes an in-flight preview build for the same PR.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-artifact:
    name: Build preview artifact
    # 90 (not 60): a PR that changes the elisp-doc engine or lisp/ forces a
    # cold rebuild of the /help/api/ per-package fragments. Same-repo PRs
    # pass the cachix writer token (fork runs get none, staying pull-only),
    # so that first build populates the jylhis cache for later runs.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build site
        run: nix build .#site -o result-site

      - name: Assemble site tree
        run: |
          mkdir -p site
          cp -rL result-site/public/. site/

      - name: Upload preview artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-pr-${{ github.event.pull_request.number }}
          path: site
          retention-days: 14

      # Point reviewers at the artifact. Skipped for forks, whose
      # pull_request runs get a read-only token that can't comment (the
      # artifact still uploads and is downloadable from the run).
      - name: Comment artifact link
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artUrl = process.env.ARTIFACT_URL || runUrl;
            const marker = '<!-- pr-preview -->';
            const body = `${marker}\n### 🔎 Site preview built\n\nThe full site for this PR is a downloadable artifact: **[site-preview-pr-${pr}](${artUrl})** (from [the workflow run](${runUrl}), under **Artifacts**).\n\nUnzip and serve it locally mounted under \`/jotain/\` (baseHref) — e.g. \`ln -s "$PWD/<unzipped>" /tmp/site/jotain && python3 -m http.server -d /tmp/site 8080\` → http://localhost:8080/jotain/\n\n_Updated for ${context.sha.substring(0, 12)}._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, body,
              });
            }
