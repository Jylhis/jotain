# PR site previews as downloadable artifacts.
#
# Pages hosts a single deployment (deploy.yml), so each PR's full `.#site`
# is uploaded as a `site.tgz` workflow artifact instead. To view it, unzip
# the artifact, extract site.tgz under /jotain/ (the baseHref) and serve:
#
#   mkdir -p /tmp/site/jotain && tar xzf site.tgz -C /tmp/site/jotain
#   python3 -m http.server -d /tmp/site 8080   # → http://localhost:8080/jotain/
#
# Every `uses:` must be github-owned or match cachix/*: the repo restricts
# Actions to those.
name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push supersedes an in-flight preview build for the same PR.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-artifact:
    name: Build preview artifact
    # A PR touching the elisp-doc engine or lisp/ rebuilds the /help/api/
    # fragments cold. Same-repo PRs get the cachix writer token (forks
    # stay pull-only), so that build fills the cache for later runs.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build site
        run: nix build .#site -o result-site

      # upload-artifact rejects some /help/api/ filenames (":", e.g.
      # org-babel-execute:python.html, and "*"/"?"/"<"/">"), so upload a
      # tarball, as upload-pages-artifact does internally.
      - name: Pack site tarball
        run: |
          mkdir -p out
          tar -czf out/site.tgz -C result-site/public .

      - name: Upload preview artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: site-preview-pr-${{ github.event.pull_request.number }}
          path: out/site.tgz
          retention-days: 14

      # Skipped for forks: their read-only token cannot comment (the
      # artifact still uploads).
      - name: Comment artifact link
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artUrl = process.env.ARTIFACT_URL || runUrl;
            const marker = '<!-- pr-preview -->';
            const body = `${marker}\n### 🔎 Site preview built\n\nThe full site for this PR is a downloadable artifact: **[site-preview-pr-${pr}](${artUrl})** (from [the workflow run](${runUrl}), under **Artifacts**).\n\nUnzip it, extract the \`site.tgz\` inside, and serve it locally mounted under \`/jotain/\` (the baseHref):\n\n\`\`\`sh\nmkdir -p /tmp/site/jotain && tar xzf site.tgz -C /tmp/site/jotain\npython3 -m http.server -d /tmp/site 8080   # → http://localhost:8080/jotain/\n\`\`\`\n\n_Updated for ${context.sha.substring(0, 12)}._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, body,
              });
            }
