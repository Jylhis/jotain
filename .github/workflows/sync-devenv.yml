# Keep Dependabot's nix PRs self-consistent.
#
# The "nix" ecosystem bumps flake.lock only, but devenv.yaml/devenv.lock
# pin the same three inputs, so a raw Dependabot PR fails ci.yml's
# `just verify`. This runs `just sync-devenv` and pushes the result.
#
# A PAT, not GITHUB_TOKEN: a GITHUB_TOKEN push starts no new ci.yml run,
# leaving the synced head without CI. DEVENV_SYNC_TOKEN is a fine-grained
# PAT for this repo with Contents: read+write only. It must exist in BOTH
# secret stores: Dependabot-triggered runs cannot see Actions secrets, and
# the follow-up synchronize run (actor = the PAT owner) cannot see
# Dependabot secrets.
name: Sync devenv pins

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # For testing against a hand-made branch without waiting for Dependabot.
  workflow_dispatch:

# A Dependabot rebase supersedes the run it interrupts — that run's push
# would be rejected as non-fast-forward anyway.
concurrency:
  group: devenv-sync-${{ github.ref }}
  cancel-in-progress: true

# Dependabot-triggered runs get a read-only token by default. The push
# below uses the PAT, so this only needs to cover the checkout.
permissions:
  contents: read

jobs:
  sync:
    name: Sync devenv pins
    # Guard on head_ref, not github.actor: the actor becomes the PAT
    # owner on the synchronize event this job's push creates. The
    # same-repo test keeps out fork PRs (no secrets). No `paths:` filter:
    # a filtered-out run would be a permanently pending required check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'dependabot/nix/'))
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      # Check out the PR head branch (refs/pull/N/merge is unpushable).
      #
      # Read-only GITHUB_TOKEN and persist-credentials: false on purpose:
      # the PAT in .git/config would reach two third-party actions and
      # `devenv update`, which builds arbitrary Nix code from flake
      # inputs. Only the push step gets the PAT.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          extraPullNames: devenv,nix-community

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      # Never `just update`: its `nix flake update` would discard the
      # Dependabot revs. Call the leaf recipe directly, since `nix run`
      # does not put `just` on PATH for nested `just` calls.
      - name: Sync devenv.yaml and devenv.lock to flake.lock
        run: nix run nixpkgs#just -- sync-devenv

      # The pathspec ignores .devenv/ and result* output. Finding no diff
      # also ends the push -> synchronize -> sync cycle.
      - name: Commit and push if anything drifted
        env:
          # Scoped to this step (see checkout). In the push URL, not an
          # http.extraheader: Actions masks raw secrets in logs, but not
          # their base64 encoding.
          SYNC_TOKEN: ${{ secrets.DEVENV_SYNC_TOKEN }}
        run: |
          if git diff --quiet -- devenv.yaml devenv.lock; then
            echo "devenv pins already match flake.lock — nothing to push."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add devenv.yaml devenv.lock
          # [dependabot skip] keeps Dependabot rebasing the PR despite the
          # extra commit. Separate -m flags: a heredoc terminator cannot be
          # indented inside a YAML block scalar.
          git commit \
            -m 'build(deps): sync devenv pins with flake.lock' \
            -m "Dependabot's nix updates bump flake.lock only. Re-run the sync half of \`just update\` so devenv.yaml and devenv.lock pin the same revs for nixpkgs, treefmt-nix and emacs-overlay, and \`just verify\` passes." \
            -m '[dependabot skip]'
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "DEVENV_SYNC_TOKEN is not set. It must exist in BOTH the" >&2
            echo "Actions and Dependabot secret stores — Dependabot-triggered" >&2
            echo "runs cannot read Actions secrets, and the follow-up" >&2
            echo "synchronize run cannot read Dependabot secrets." >&2
            exit 1
          fi
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"

      # Fail loudly if the sync did not converge.
      - name: Verify both locks now agree
        run: nix run nixpkgs#just -- verify
