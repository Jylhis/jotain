# Dependabot configuration.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Bumps flake.lock only; .github/workflows/sync-devenv.yml re-syncs
  # devenv.yaml/devenv.lock on these branches so `just verify` passes.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "monthly"
    # One PR per cycle instead of one per input.
    groups:
      nix-inputs:
        patterns: ["*"]
    # Let fast-moving revs (nixpkgs, emacs-overlay) settle first.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    # The repo's commit scope for dependency bumps (AGENTS.md).
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
