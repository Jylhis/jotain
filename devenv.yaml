# The shared inputs are pinned to flake.lock's revs; bump with
# `just update`, re-sync with `just sync-devenv`.
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/aa48d347080940b8a2b8d2f48228674e280a3514
  treefmt-nix:
    url: github:numtide/treefmt-nix/03d8ee1bcbc8f9638907bb79edb9673151d0e22b
    inputs:
      nixpkgs:
        follows: nixpkgs
  emacs-overlay:
    url: github:nix-community/emacs-overlay/a4b730221c66916a07b19edd3b2f20115b8d40e4
    inputs:
      nixpkgs:
        follows: nixpkgs
