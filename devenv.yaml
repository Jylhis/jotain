# The shared inputs are pinned to flake.lock's revs; bump with
# `just update`, re-sync with `just sync-devenv`.
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/e21fec321d73511849707a7585e4ea155ee4bf40
  treefmt-nix:
    url: github:numtide/treefmt-nix/0ba5d67225c3f5c88eb134e1a665a379bfd3bea9
    inputs:
      nixpkgs:
        follows: nixpkgs
  emacs-overlay:
    url: github:nix-community/emacs-overlay/f6a683d748ac17b220ba478d299fda336a1a7110
    inputs:
      nixpkgs:
        follows: nixpkgs
