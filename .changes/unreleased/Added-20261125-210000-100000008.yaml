kind: Added
body: The default package now starts an Emacs configured with Jotain, so `nix run .` works. Its state lives in `$XDG_STATE_HOME/jotain`, or in `$JOTAIN_INIT_DIRECTORY` when set, and `--init-directory` still wins. The previous default is the `emacs-with-packages` package.
time: 2026-11-25T21:00:00.000000000+02:00
