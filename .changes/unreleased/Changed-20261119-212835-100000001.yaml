kind: Changed
body: Drop settings that restate Emacs 31 or package defaults, the per-package `@doc` comment blocks, the mdoc Flymake backend and the custom tree-sitter remap table (now `treesit-enabled-modes`). The options `jotain-completion-auto-prefix`, `jotain-completion-auto-delay`, `jotain-prog-ts-remaps` and `jotain-prog-warn-non-ts-mode` are gone.
