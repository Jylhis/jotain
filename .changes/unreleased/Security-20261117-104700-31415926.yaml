kind: Security
body: 'The `magit-land` review of a held set now shows the full diff in `diff-mode` under the gates, files and diffstat, as literal text, and refuses a diff whose sha256 is not the patch id. Approve passes that patch id. When the git-land daemon stopped itself because main moved outside the queue, the queue section shows the reason, and `P` (resume) shows the move, asks which main to trust, then runs `git land resume --yes --main SHA` with the commit of the status it showed.'
