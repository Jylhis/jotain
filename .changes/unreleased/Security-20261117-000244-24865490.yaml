kind: Security
body: '`C-u L` in the `magit-land` summary buffer no longer runs `git-land approve --yes` blind: it shows the gates, the changed files and the diffstat of the held set, asks with `yes-or-no-p`, then approves that set by id. The `&` approve action shows the same review and also uses `yes-or-no-p`. Both run `git-land approve --yes --patch ID SET` with the patch id of the review, so a change that moved between the review and the approval is refused. A review without a patch id is an error.'
time: 2026-11-17T00:02:44.02486549+01:00
