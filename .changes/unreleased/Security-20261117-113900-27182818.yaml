kind: Security
body: 'The `magit-land` review buffer is now `magit-land-review-mode`, a read-only `diff-mode` with an allow-list keymap (hunk and file navigation, scrolling, `q`) that has none of the `diff-mode` commands that visit, apply, test, reverse or edit the files the diff names. It sets `diff-font-lock-syntax` to nil, so the file names that an agent chose no longer pick the major modes that fontify the hunks, and it uses `/` as `default-directory` instead of the repository.'
time: 2026-11-17T11:39:00.27182818+01:00
