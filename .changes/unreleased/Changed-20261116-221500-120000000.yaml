kind: Changed
body: |-
  `magit-land` shows the git-land queue in the magit status buffer from `git land status --all --json`: the lane sets with their step and elapsed time, the held and blocked sets, and the unqueued branches. `&` on a set, an item or a branch opens a menu to add, approve, reject, remove, retry, bump, show, log, pause and resume. A daemon that is down or old gives one line instead of an error.
