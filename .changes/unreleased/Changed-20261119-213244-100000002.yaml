kind: Changed
body: The Emacs build is emacs-overlay's `emacs-unstable-pgtk` directly and packages are resolved with `emacsWithPackagesFromUsePackage`. `emacs.nix`, its `git`/`igc`/`mainline` variants, the ccache and `cpuTune` builds, the cache-parity check, the generated package and API references and `scripts/update-pins.sh` are removed; `just update-pins` calls nix-update.
