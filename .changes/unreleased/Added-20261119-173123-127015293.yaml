kind: Added
body: '`services.jotain.users.<name>` (`module-system.nix`) builds the wrapped Emacs, the EDITOR and VISUAL scripts, `jotctl` and the dictionaries for one user and installs them in the user''s profile. The Home Manager module takes them from there and keeps the config files and the daemon unit.'
