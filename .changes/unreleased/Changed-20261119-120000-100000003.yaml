kind: Changed
body: The Home Manager module now runs the daemon through home-manager's services.emacs, so the unit is emacs.service (and emacs.socket) instead of jotain.service. Set extraOptions, client.enable, client.arguments, socketActivation.enable and startWithUserSession under services.emacs; the same options under services.jotain are removed.
