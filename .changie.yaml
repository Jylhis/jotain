changesDir: .changes
unreleasedDir: unreleased
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: "## {{.Version}}"
kindFormat: "\n### {{.Kind}}\n"
changeFormat: "- {{.Body}}"
fragmentFileFormat: '{{.Kind}}-{{.Time.Format "20060102-150405"}}-{{.Time.Nanosecond}}'
kinds:
  - label: Added
  - label: Changed
  - label: Deprecated
  - label: Removed
  - label: Fixed
  - label: Security
